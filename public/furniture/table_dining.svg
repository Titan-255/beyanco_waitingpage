<svg width="360" height="200" viewBox="0 0 360 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="dinShadow" x="0" y="0" width="360" height="200" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="walnutGrad" x1="180" y1="45" x2="180" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#73523B"/>
      <stop offset="100%" stop-color="#4F3624"/>
    </linearGradient>
  </defs>
  <g filter="url(#dinShadow)">
    <!-- Trestle Legs -->
    <path d="M60 70 L48 175 L62 175 L74 70 Z" fill="#3D291A"/>
    <path d="M300 70 L312 175 L298 175 L286 70 Z" fill="#3D291A"/>
    <!-- Stretcher Bar -->
    <rect x="55" y="145" width="250" height="8" rx="2" fill="#2E1F14"/>
    
    <!-- Chamfered Edge Solid Walnut Tabletop -->
    <rect x="30" y="55" width="300" height="22" rx="6" fill="#3D291A"/>
    <rect x="32" y="50" width="296" height="18" rx="5" fill="url(#walnutGrad)"/>
    <!-- Realistic Wood Grain Highlights -->
    <line x1="50" y1="58" x2="310" y2="58" stroke="#8A674D" stroke-width="1" stroke-dasharray="80 15 60 20" opacity="0.6"/>
  </g>
</svg>
