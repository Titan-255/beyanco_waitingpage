<svg width="240" height="200" viewBox="0 0 240 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="penShadow" x="0" y="0" width="240" height="200" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#penShadow)">
    <!-- Ceiling Cord -->
    <line x1="120" y1="0" x2="120" y2="80" stroke="#1E293B" stroke-width="2"/>
    <!-- Canopy -->
    <rect x="110" y="0" width="20" height="6" rx="2" fill="#1E293B"/>
    <!-- Minimalist Black Halo Ring -->
    <circle cx="120" cy="115" r="55" stroke="#1E293B" stroke-width="5" fill="none"/>
    <!-- Inner Opal Glass Globe Diffusers -->
    <circle cx="120" cy="62" r="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="120" cy="168" r="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Warm Ambient Illumination -->
    <circle cx="120" cy="62" r="10" fill="#FFFDF0" opacity="0.9"/>
    <circle cx="120" cy="168" r="10" fill="#FFFDF0" opacity="0.9"/>
  </g>
</svg>
