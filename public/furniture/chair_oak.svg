<svg width="220" height="240" viewBox="0 0 220 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="oakShadow" x="0" y="0" width="220" height="240" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#oakShadow)">
    <!-- Back Leg Rears -->
    <line x1="60" y1="120" x2="45" y2="215" stroke="#7A5F45" stroke-width="8" stroke-linecap="round"/>
    <line x1="160" y1="120" x2="175" y2="215" stroke="#7A5F45" stroke-width="8" stroke-linecap="round"/>
    <!-- Upholstered Backrest -->
    <rect x="52" y="35" width="116" height="85" rx="14" fill="#E8E4DA" stroke="#BCB4A4" stroke-width="2"/>
    <rect x="60" y="42" width="100" height="71" rx="10" fill="#F4F1EA"/>
    <!-- Timber Arms & Frame -->
    <path d="M42 95 L50 82 L170 82 L178 95" stroke="#9A7B5C" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front Legs -->
    <line x1="50" y1="140" x2="48" y2="220" stroke="#9A7B5C" stroke-width="8" stroke-linecap="round"/>
    <line x1="170" y1="140" x2="172" y2="220" stroke="#9A7B5C" stroke-width="8" stroke-linecap="round"/>
    <!-- Seat Cushion -->
    <rect x="42" y="115" width="136" height="42" rx="8" fill="#E6E1D5" stroke="#B8AF9E" stroke-width="2"/>
  </g>
</svg>
